name: Release

on:
  push:
    branches: [main, nexus-compliant]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 1.0.0, without v prefix)"
        required: true

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_version: ${{ steps.sr.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - run: npm ci

      - name: Run semantic-release
        id: sr
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build Windows Installer
    needs: [release]
    if: "!cancelled() && (needs.release.outputs.new_release_version != '' || github.event_name == 'workflow_dispatch')"
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release.outputs.new_release_version || github.event.inputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.version) || '' }}

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.x"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build backend (PyInstaller)
        working-directory: backend
        run: |
          uv sync --extra build
          uv run pyinstaller rmm-backend.spec --clean --noconfirm

      - name: Copy sidecar binary
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path frontend\src-tauri\binaries
          Copy-Item backend\dist\rmm-backend.exe frontend\src-tauri\binaries\rmm-backend-x86_64-pc-windows-msvc.exe

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Bump version in manifests
        shell: bash
        run: bash scripts/bump-version.sh "$VERSION"

      - name: Build Tauri installer
        working-directory: frontend
        run: npx tauri build

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${VERSION}" --clobber \
            frontend/src-tauri/target/release/bundle/nsis/*-setup.exe

  upload-nexus:
    name: Upload to Nexus Mods
    needs: [release, build]
    if: needs.release.outputs.new_release_version != '' && contains(needs.release.outputs.new_release_version, '-nexus.')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Download installer from GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: v${{ needs.release.outputs.new_release_version }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p dist
          gh release download "$TAG_NAME" \
            --repo "$REPO" \
            --pattern "*-setup.exe" \
            --dir ./dist

      - name: Resolve installer path
        id: resolve
        run: |
          shopt -s nullglob
          exe_files=( ./dist/*-setup.exe )
          if [[ ${#exe_files[@]} -ne 1 ]]; then
            echo "::error::Expected exactly 1 setup .exe in the release, found ${#exe_files[@]}"
            exit 1
          fi
          echo "file=${exe_files[0]}" >> "$GITHUB_OUTPUT"

      - name: Wrap installer in ZIP for Nexus upload
        id: wrap
        env:
          EXE_PATH: ${{ steps.resolve.outputs.file }}
        run: |
          base=$(basename "$EXE_PATH" .exe)
          zip_path="dist/${base}.zip"
          # -0 store-only: PyInstaller payload is already compressed, so compression
          # would barely shrink it; storing is faster and the inner .exe stays
          # byte-identical regardless. -j strips the dist/ prefix inside the zip.
          zip -0 -j "$zip_path" "$EXE_PATH"
          # Validate the archive integrity before handing it to the upload step
          unzip -t "$zip_path"
          echo "file=./${zip_path}" >> "$GITHUB_OUTPUT"

      - name: Upload to Nexus Mods
        uses: Nexus-Mods/upload-action@a746f1867153abc77beed950bf7526ece1a9f8c4 # v1.0.0-beta.5
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_group_id: ${{ secrets.NEXUS_GROUP_ID }}
          filename: ${{ steps.wrap.outputs.file }}
          version: ${{ needs.release.outputs.new_release_version }}
          display_name: RipperMod Manager ${{ needs.release.outputs.new_release_version }}
          description: |
            Nexus-compliant installer (Windows). Extract the .zip and run the
            included .exe to install. Full release notes:
            https://github.com/${{ github.repository }}/releases/tag/v${{ needs.release.outputs.new_release_version }}
          file_category: main
          archive_existing_file: 'true'
