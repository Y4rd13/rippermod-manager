name: Upload to Nexus Mods

# Fires only when the maintainer manually promotes a draft release to published
# (or manually re-runs from Actions). Restricted to nexus-compliant tags
# (vX.Y.Z-nexus.N) - non-nexus releases on main never trigger an upload.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload (e.g. v2.0.0-nexus.10)"
        required: true

concurrency:
  group: upload-nexus-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  upload-nexus:
    name: Upload to Nexus Mods
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      (github.event_name == 'release' && contains(github.event.release.tag_name, '-nexus.')) ||
      (github.event_name == 'workflow_dispatch' && contains(github.event.inputs.tag, '-nexus.'))
    permissions:
      contents: read
    env:
      TAG_NAME: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.tag }}
    steps:
      - name: Download installer from GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p dist
          gh release download "$TAG_NAME" \
            --repo "$REPO" \
            --pattern "*-setup.exe" \
            --dir ./dist

      - name: Resolve installer path
        id: resolve
        run: |
          shopt -s nullglob
          exe_files=( ./dist/*-setup.exe )
          if [[ ${#exe_files[@]} -ne 1 ]]; then
            echo "::error::Expected exactly 1 setup .exe in the release, found ${#exe_files[@]}"
            exit 1
          fi
          echo "file=${exe_files[0]}" >> "$GITHUB_OUTPUT"

      - name: Wrap installer in ZIP for Nexus upload
        id: wrap
        env:
          EXE_PATH: ${{ steps.resolve.outputs.file }}
        run: |
          base=$(basename "$EXE_PATH" .exe)
          zip_path="dist/${base}.zip"
          # -0 store-only: PyInstaller payload is already compressed, so compression
          # would barely shrink it; storing is faster and the inner .exe stays
          # byte-identical regardless. -j strips the dist/ prefix inside the zip.
          zip -0 -j "$zip_path" "$EXE_PATH"
          unzip -t "$zip_path"
          echo "file=./${zip_path}" >> "$GITHUB_OUTPUT"

      - name: Resolve version (strip leading 'v')
        id: version
        run: |
          version="${TAG_NAME#v}"
          echo "value=${version}" >> "$GITHUB_OUTPUT"

      - name: Fetch GitHub release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Random delimiter avoids any collision with the body content.
          delim="EOF_$(openssl rand -hex 8)"
          # Cap at 80 lines so we stay well under Nexus's description size limit;
          # the GitHub release link in the description still has the full notes.
          body=$(gh release view "$TAG_NAME" --repo "$REPO" --json body --jq '.body // ""' | head -n 80)
          {
            echo "body<<${delim}"
            printf '%s\n' "$body"
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload to Nexus Mods
        uses: Nexus-Mods/upload-action@a746f1867153abc77beed950bf7526ece1a9f8c4 # v1.0.0-beta.5
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_group_id: ${{ secrets.NEXUS_GROUP_ID }}
          filename: ${{ steps.wrap.outputs.file }}
          version: ${{ steps.version.outputs.value }}
          display_name: RipperMod Manager ${{ steps.version.outputs.value }}
          description: |
            Nexus-compliant installer (Windows). Extract the .zip and run the
            included .exe to install.

            --- Changes in this release ---
            ${{ steps.notes.outputs.body }}

            Full release notes:
            https://github.com/${{ github.repository }}/releases/tag/${{ env.TAG_NAME }}
          file_category: main
          archive_existing_file: 'true'
